<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credpool Admin Login</title>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #1e293b; padding: 30px; border-radius: 12px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); width: 300px; }
        input[type="text"] { width: 100%; padding: 10px; margin: 15px 0; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #4f46e5; border: none; color: white; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:hover { background: #4338ca; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Admin Login</h2>
        <form onsubmit="handleLogin(event)">
            <input id="mobile-input" type="text" maxlength="10" required placeholder="Enter Mobile Number">
            <button type="submit">Login to Dashboard</button>
        </form>
    </div>
    <script>
        function handleLogin(event) {
            event.preventDefault();
            const mobileInput = document.getElementById('mobile-input').value;
            if (mobileInput === "7889155454") {
                localStorage.setItem("role", "admin");
                localStorage.setItem("isLoggedIn", "true");
                alert("लॉगिन सफल!");
                window.location.href = 'dashboard.html';
            } else {
                alert("त्रुटि: गलत नंबर!");
            }
        }
    </script>
</body>
</html>
