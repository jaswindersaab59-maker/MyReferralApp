<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Credpool</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8fafc; color: #0f172a; min-height: 100vh; display: flex; flex-direction: column; }
        header { background-color: #ffffff; border-bottom: 1px solid #e2e8f0; width: 100%; }
        .nav-container { max-width: 1100px; margin: 0 auto; padding: 16px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 20px; font-weight: bold; color: #4f46e5; text-decoration: none; }
        .back-link { text-decoration: none; color: #475569; font-size: 14px; font-weight: 500; }
        .login-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 16px; }
        .login-card { background: #ffffff; border: 1px solid #e2e8f0; padding: 32px; border-radius: 20px; width: 100%; max-width: 440px; }
        .card-header { text-align: center; margin-bottom: 32px; }
        .card-header h1 { font-size: 28px; font-weight: 800; color: #020617; }
        .form-group { margin-bottom: 20px; position: relative; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; color: #334155; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 12px; font-size: 15px; background-color: #f8fafc; }
        .password-toggle { position: absolute; right: 16px; top: 38px; background: none; border: none; color: #64748b; font-size: 14px; }
        .btn-submit { width: 100%; background-color: #4f46e5; color: #ffffff; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <header><div class="nav-container"><a href="index.html" class="logo">Credpool</a><a href="index.html" class="back-link">← Back</a></div></header>
    <div class="login-container"><div class="login-card"><div class="card-header"><h1>Welcome Back</h1></div>
    <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';"><div class="form-group"><label>Email Address</label><input type="email" placeholder="name@company.com" required></div>
    <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="••••••••" required><button type="button" class="password-toggle" onclick="t=document.getElementById('password');if(t.type==='password'){t.type='text';this.textContent='Hide';}else{t.type='password';this.textContent='Show';}">Show</button></div>
    <button type="submit" class="btn-submit">Sign In to Dashboard</button></form></div></div>
</body>
</html>
