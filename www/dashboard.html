<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Dashboard - Credpool</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8fafc; color: #334155; display: flex; min-height: 100vh; flex-direction: column; }
        header { background-color: #ffffff; border-bottom: 1px solid #e2e8f0; width: 100%; }
        .nav-container { max-width: 1200px; margin: 0 auto; padding: 16px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 20px; font-weight: bold; color: #4f46e5; text-decoration: none; }
        .owner-badge { background-color: #f59e0b; color: #ffffff; font-size: 11px; padding: 2px 8px; border-radius: 9999px; }
        .dash-container { max-width: 1200px; width: 100%; margin: 32px auto; padding: 0 16px; flex: 1; }
        .welcome-bar { background: linear-gradient(135deg, #4f46e5, #4338ca); color: #ffffff; padding: 24px; border-radius: 20px; margin-bottom: 32px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
        .stat-card { background-color: #ffffff; border: 1px solid #e2e8f0; padding: 20px; border-radius: 16px; }
        .stat-value { font-size: 24px; font-weight: 800; color: #0f172a; }
    </style>
</head>
<body>
    <header><div class="nav-container"><div><a href="index.html" class="logo">Credpool</a> <span class="owner-badge">Owner Mode</span></div><a href="index.html" style="text-decoration:none; color:red;">Log Out</a></div></header>
    <div class="dash-container">
        <div class="welcome-bar"><h1>Hello, Primary Owner</h1><p>Your network trust ecosystem is active.</p></div>
        <div class="stats-grid">
            <div class="stat-card"><div>Total Pool Liquidity</div><div class="stat-value">$250,000.00</div></div>
            <div class="stat-card"><div>System Users</div><div class="stat-value">1 User (You)</div></div>
        </div>
    </div>
</body>
</html>
